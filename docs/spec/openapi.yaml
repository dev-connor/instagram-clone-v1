info:
  title: Instagram Clone API
  description: ''
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignupDto:
      type: object
      properties:
        username:
          type: string
          example: gildong
          minLength: 3
          maxLength: 30
          description: 영문/숫자/밑줄/마침표만 허용
        email:
          type: string
          example: gildong@example.com
          maxLength: 255
        password:
          type: string
          example: P@ssw0rd!
          minLength: 8
          maxLength: 72
        name:
          type: string
          example: 홍길동
          maxLength: 50
      required:
        - username
        - email
        - password
    MeDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: gildong
        email:
          type: string
          example: gildong@example.com
        name:
          type: object
          example: 홍길동
          nullable: true
        bio:
          type: object
          example: 안녕하세요 :)
          nullable: true
        profileImageUrl:
          type: object
          example: https://cdn.example.com/avatars/gildong.jpg
          nullable: true
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - username
        - email
        - name
        - bio
        - profileImageUrl
        - createdAt
        - updatedAt
    AuthResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'JWT 액세스 토큰 (Authorization: Bearer <token>)'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/MeDto'
      required:
        - accessToken
        - user
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: gildong@example.com
        password:
          type: string
          example: P@ssw0rd!
      required:
        - email
        - password
    UpdateProfileDto:
      type: object
      properties:
        name:
          type: string
          example: 홍길동
          maxLength: 50
        bio:
          type: string
          example: 안녕하세요 :)
          maxLength: 150
        profileImageUrl:
          type: string
          example: https://cdn.example.com/avatars/gildong.jpg
          maxLength: 500
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: gildong
        name:
          type: object
          example: 홍길동
          nullable: true
        bio:
          type: object
          example: 안녕하세요 :)
          nullable: true
        profileImageUrl:
          type: object
          example: https://cdn.example.com/avatars/gildong.jpg
          nullable: true
        postCount:
          type: number
          description: 작성한 게시물 수
          example: 42
        followerCount:
          type: number
          description: 팔로워 수
          example: 128
        followingCount:
          type: number
          description: 팔로잉 수
          example: 87
        isFollowedByMe:
          type: boolean
          description: 요청한 본인이 이 사용자를 팔로우 중인지 여부
          example: false
      required:
        - id
        - username
        - name
        - bio
        - profileImageUrl
        - postCount
        - followerCount
        - followingCount
        - isFollowedByMe
    UserSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: gildong
        name:
          type: object
          example: 홍길동
          nullable: true
        profileImageUrl:
          type: object
          example: https://cdn.example.com/avatars/gildong.jpg
          nullable: true
      required:
        - id
        - username
        - name
        - profileImageUrl
    PostResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummaryDto'
        imageUrl:
          type: string
          example: https://cdn.example.com/posts/abc.jpg
        caption:
          type: object
          example: 오늘의 훈련 🏋️
          nullable: true
        location:
          type: object
          example: 평창국민체육관
          nullable: true
        likeCount:
          type: number
          description: 좋아요 수
          example: 24
        commentCount:
          type: number
          description: 댓글 수
          example: 3
        isLikedByMe:
          type: boolean
          description: 요청한 본인이 이 게시물에 좋아요를 눌렀는지 여부
          example: false
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - author
        - imageUrl
        - caption
        - location
        - likeCount
        - commentCount
        - isLikedByMe
        - createdAt
        - updatedAt
    PageMetaDto:
      type: object
      properties:
        page:
          type: number
          description: 현재 페이지 번호
          example: 1
        limit:
          type: number
          description: 페이지당 항목 수
          example: 20
        totalItems:
          type: number
          description: 전체 항목 수
          example: 137
        totalPages:
          type: number
          description: 전체 페이지 수
          example: 7
        hasNextPage:
          type: boolean
          description: 다음 페이지 존재 여부
          example: true
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasNextPage
    PaginatedPostsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostResponseDto'
        meta:
          $ref: '#/components/schemas/PageMetaDto'
      required:
        - items
        - meta
    CreatePostDto:
      type: object
      properties:
        imageUrl:
          type: string
          description: 게시물 이미지 URL
          example: https://cdn.example.com/posts/abc.jpg
          maxLength: 500
        caption:
          type: string
          example: 오늘의 훈련 🏋️
          maxLength: 2200
        location:
          type: string
          example: 평창국민체육관
          maxLength: 100
      required:
        - imageUrl
    CreateCommentDto:
      type: object
      properties:
        content:
          type: string
          example: 멋진 사진이네요!
          maxLength: 2200
      required:
        - content
    CommentResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummaryDto'
        content:
          type: string
          example: 멋진 사진이네요!
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - postId
        - author
        - content
        - createdAt
        - updatedAt
    PaginatedCommentsDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponseDto'
        meta:
          $ref: '#/components/schemas/PageMetaDto'
      required:
        - items
        - meta
    LikeStatusDto:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        isLikedByMe:
          type: boolean
          description: 본인의 좋아요 여부
          example: true
        likeCount:
          type: number
          description: 해당 게시물의 총 좋아요 수
          example: 25
      required:
        - postId
        - isLikedByMe
        - likeCount
    LikeCountDto:
      type: object
      properties:
        postId:
          type: string
          format: uuid
        likeCount:
          type: number
          description: 해당 게시물의 총 좋아요 수
          example: 25
      required:
        - postId
        - likeCount
    FollowStatusDto:
      type: object
      properties:
        userId:
          type: string
          description: 대상 사용자 id
          format: uuid
        isFollowedByMe:
          type: boolean
          description: 본인이 이 사용자를 팔로우 중인지 여부
          example: true
        followerCount:
          type: number
          description: 대상 사용자의 팔로워 수
          example: 129
      required:
        - userId
        - isFollowedByMe
        - followerCount
    PaginatedUsersDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryDto'
        meta:
          $ref: '#/components/schemas/PageMetaDto'
      required:
        - items
        - meta
